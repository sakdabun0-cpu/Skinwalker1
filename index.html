<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Hear It?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #070709;
      color: #d9d9d9;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      overflow: hidden;
      user-select: none;
    }

    /* Creepy glowing silhouette / image container */
    .entity-box {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #1f0a0a 20%, #070709 75%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(180, 0, 0, 0.35);
      position: relative;
    }

    /* Glowing eyes effect */
    .eyes {
      display: flex;
      gap: 28px;
    }

    .eye {
      width: 10px;
      height: 10px;
      background-color: #ff1e1e;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff1e1e, 0 0 24px #ff0000;
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      padding: 0 20px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 30, 30, 0.6);
    }

    p {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 25px;
    }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-family: 'Courier New', Courier, monospace;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    #btn-yes {
      background-color: #8b0000;
      color: #ffffff;
      font-weight: bold;
      border-color: #ff1e1e;
    }

    #btn-yes:hover {
      transform: scale(1.08);
      background-color: #b30000;
    }

    #btn-no {
      background-color: #16161a;
      color: #999999;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="entity-box" id="entity">
    <!-- Replace the eyes div with <img src="skinwalker.jpg" style="width:100%; border-radius:50%;"> if you have an image -->
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
  </div>

  <h1 id="question">Something is outside imitating your friend's voice...<br>Will you open the door?</h1>
  <p id="subtext">(Do not look it in the eyes)</p>

  <div class="buttons">
    <button id="btn-yes">🚪 Open Door</button>
    <button id="btn-no">🔒 Keep Locked</button>
  </div>

  <script>
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const question = document.getElementById('question');
    const subtext = document.getElementById('subtext');
    const entity = document.getElementById('entity');

    // When "Open Door" is clicked
    btnYes.addEventListener('click', () => {
      document.body.style.backgroundColor = '#1a0000';
      entity.style.transform = 'scale(1.4)';
      entity.style.transition = 'transform 0.3s ease';
      question.innerHTML = "IT'S ALREADY INSIDE.";
      question.style.color = '#ff1e1e';
      subtext.textContent = "Too late.";
      btnNo.style.display = 'none';
      btnYes.style.display = 'none';
    });

    // Make "Keep Locked" dodge away on hover or touch
    function dodgeButton() {
      const maxX = window.innerWidth - btnNo.offsetWidth - 20;
      const maxY = window.innerHeight - btnNo.offsetHeight - 20;

      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * maxY));

      btnNo.style.position = 'absolute';
      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;
    }

    btnNo.addEventListener('mouseover', dodgeButton);
    btnNo.addEventListener('touchstart', dodgeButton);
  </script>

</body>
</html>
